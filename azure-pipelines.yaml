# Your original pipeline with CD added
trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  registry: 'docker.io'
  imageFrontend: 'manu144/frontend'
  imageBackend: 'manu144/backend'
  tag: '$(Build.BuildId)'

stages:
  - stage: Build
    displayName: 'Build and Push Images'
    jobs:
      - job: Build
        steps:
          - task: Docker@2
            displayName: Build & push frontend
            inputs:
              command: buildAndPush
              repository: $(imageFrontend)
              dockerfile: apps/frontend/Dockerfile
              buildContext: apps/frontend
              containerRegistry: 'manu-personal-dh'
              tags: |
                $(tag)
                latest

          - task: Docker@2
            displayName: Build & push backend
            inputs:
              command: buildAndPush
              repository: $(imageBackend)
              dockerfile: apps/backend/src/Dockerfile
              buildContext: apps/backend/src
              containerRegistry: 'manu-personal-dh'
              tags: |
                $(tag)
                latest

          - task: Bash@3
            displayName: 'Update K8s manifests with new image tags'
            inputs:
              targetType: 'inline'
              script: |
                # Update backend image
                sed -i "s|image: $(imageBackend):.*|image: $(imageBackend):$(tag)|g" k8s/backend-deployment.yaml
                
                # Update frontend image
                sed -i "s|image: $(imageFrontend):.*|image: $(imageFrontend):$(tag)|g" k8s/frontend-deployment.yaml
                
                echo "Updated images to tag: $(tag)"
                grep "image:" k8s/*-deployment.yaml

          - task: Bash@3
            displayName: 'Push changes to Git'
            inputs:
              targetType: 'inline'
              script: |
                git config user.email "azure-pipeline@devops.com"
                git config user.name "Azure Pipeline"
                git add k8s/*-deployment.yaml
                git diff --staged --quiet || git commit -m "Update images to $(tag) [skip ci]"
                git push origin HEAD:main
            env:
              GITHUB_TOKEN: $(GITHUB_TOKEN)
